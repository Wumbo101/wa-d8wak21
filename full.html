 const spark=`<div class="spark">${vs.map(v=>`<i class="${v>=L?"y":""}" style="height:${Math.max(3,v/mx*100)}%" title="${v}"></i>`).join("")}</div><div class="spark-l">${vs.map(v=>`<span>${v}</span>`).join("")}</div><p class="sub">Last 10 games played (any minutes) vs ${yes?MN[m]:L+"+"}. Green = hit.</p>`;
 const ctl=`<div class="bar"><select data-gm="${esc(n)}">${GC.concat(["DD","TD"]).map(x=>`<option value="${x}"${x===m?" selected":""}>${MN[x]}</option>`).join("")}</select>${yes?"":`<select data-gl="${esc(n)}">${(lines.length?lines:[L]).map(v=>`<option${v===L?" selected":""}>${v}</option>`).join("")}</select>`}
 <select data-gs="1">${["both","2025-26","2026-27"].map(v=>`<option value="${v}"${S.gs===v?" selected":""}>${v==="both"?"Both seasons":v}</option>`).join("")}</select><label><input type="checkbox" data-g24="1"${S.g24?" checked":""}> 24+ min only</label></div>
 ${!yes&&!lines.length?`<div class="sub">No FanDuel line for ${MN[m]} in this file.</div>`:`<div class="sub">${MN[m]}${yes?"":" "+L+"+"}: <b style="color:var(--tx)">${h}/${c}</b> (${c?(h/c*100).toFixed(1):"0"}%) in the 24+ min games shown. Grey rows are under 24 min or did not play and are not counted.</div>`}`;
 const tr=rows.slice().reverse().map(r=>{const g=r.g,op=(g[2]==="@"?"@ ":"vs ")+g[1];
  if(!r.pl)return `<tr class="gr"><td>${g[0]}</td><td>${op}</td><td colspan="${GC.length+2}" style="text-align:left">${esc(g[4])}</td></tr>`;
  return `<tr class="${r.q?"":"gr"}"><td>${g[0]}</td><td>${op}</td><td>${Math.round(g[3])}</td>${GC.map(x=>`<td${x===m&&r.q?` class="${r.hit?"y":"n"}"`:""}>${gval(g,x)}</td>`).join("")}<td>${r.q?(r.hit?"✓":"✗"):""}</td></tr>`}).join("");
 return `${spark}${ctl}<div class="tw"><table><tr><th>Date</th><th>Opp</th><th>Min</th>${GC.map(x=>`<th>${x}</th>`).join("")}<th>Hit</th></tr>${tr}</table></div>
 ${pl.h2h.length?"":`<p class="sub">No games vs ${pl.opp} in the 2025-26 or 2026-27 regular season.</p>`}`}
function card(n){const pl=D.players[n];const rows=topRows(n);if(S.qual&&!rows.length)return"";
 const mo=S.more[n]||{};const img=D.heads[n];
 const av=`<div class="av">${img?`<img src="${img}" alt="${esc(n)}" onerror="this.parentNode.textContent='${ini(n)}'">`:ini(n)}</div>`;
 return `<div class="pc${OUT.has(n)?" out":""}"><div class="ph">${av}<div><div class="nm">${esc(n)}${OUT.has(n)?'<span class="tag">OUT</span>':""}${QST.has(n)?'<span class="tag">Q</span>':""}${(C.extra||[]).includes(n)?'<span class="tag ex">Added · not in parlays</span>':""}</div><div class="sub">${pl.team} vs ${pl.opp} · ${pl.tip} ET · ${pl.n24} games of 24+ min</div></div></div>
 ${rows.length?HD+rows.map(propRow).join(""):`<div class="pr"><div class="sub">No line at ${S.min}%+ with 10+ games.</div></div>`}
 <div class="tabs">${D.lite?"":`<button data-more="${esc(n)}|lad" class="${mo.t==="lad"?"on":""}">All lines</button>`}<button data-more="${esc(n)}|gl" class="${mo.t==="gl"?"on":""}">Game log</button><button data-more="${esc(n)}|mu" class="${mo.t==="mu"?"on":""}">Matchup</button></div>
 ${mo.t==="lad"?`<div class="more">${ladder(n,pl)}</div>`:mo.t==="gl"?`<div class="more">${glog(n,pl)}</div>`:mo.t==="mu"?`<div class="more">${mtab(n,pl)}</div>`:""}</div>`}
function rk(r,soft){const c=r<=10?"soft":r>=21?"tough":"";return `<span class="rk ${c}">${ord(r)}</span>`}
function mtab(n,pl){const u=MU.players[n];if(!u)return `<p class="sub">No matchup data.</p>`;const o=u.opp;let h="";
 if(u.dvp){h+=`<section><h4>Defense vs ${u.pos}s · ${pl.opp}</h4><p class="sub">Per game allowed to ${u.pos}s. Rank 1 = most allowed (softest). 2026-27: ${u.g["2027"]} games${u.g["2027"]<10?" (small sample)":""}; 2025-26: ${u.g["2026"]} games.</p>
 <div class="tw"><table class="mt"><tr><th></th>${DVM.map(m=>`<th>${m}</th>`).join("")}</tr>
 <tr><td>2026-27</td>${DVM.map(m=>{const x=u.dvp["2027"][m];return `<td>${rk(x[1])}<small>${x[0]}</small></td>`}).join("")}</tr>
 <tr><td>2025-26</td>${DVM.map(m=>{const x=u.dvp["2026"][m];return `<td>${rk(x[1])}<small>${x[0]}</small></td>`}).join("")}</tr></table></div></section>`}
 const tc=(y)=>u.team[y];const T=(lbl,k,desc)=>`<tr><td>${lbl}</td>${["2027","2026"].map(y=>{const x=tc(y);return x?`<td>${x[k][0]} <small>${ord(x[k][1])}</small></td>`:"<td>–</td>"}).join("")}<td class="sub">${desc}</td></tr>`;
 h+=`<section><h4>Team context · ${pl.opp}</h4><div class="tw"><table class="mt"><tr><th></th><th>2026-27</th><th>2025-26</th><th></th></tr>${T("Pace","pace","1st = fastest")}${T("Def. rating","drtg","1st = best defense")}${T("Paint pts allowed","paint","1st = most allowed")}</table></div></section>`;
 const qs=topRows(n).filter(p=>p.m in {PTS:1,REB:1,AST:1,"3PM":1,PRA:1,PR:1,PA:1,RA:1});
 if(qs.length){h+=`<section><h4>Vs soft defenses</h4><p class="sub">24+ min games vs teams ranked 1st–12th at allowing that stat to ${u.pos}s (that season's ranks).</p><div class="tw"><table class="mt"><tr><th>Prop</th><th>All 24+</th><th>Vs soft D</th></tr>${qs.map(p=>{const s=MU.split[`${p.player}|${p.m}|${p.side}|${p.line}`];return `<tr><td>${esc(lab(p))}</td><td>${p.hits}/${p.games} · ${Math.round(p.hit)}%</td><td>${s&&s[1]?`${s[0]}/${s[1]} · ${Math.round(s[0]/s[1]*100)}%${s[1]<SMALL?' <small>small</small>':""}`:"–"}</td></tr>`}).join("")}</table></div></section>`}
 const ww=MU.ww[n]||[];
 h+=`<section><h4>Without teammates</h4>${ww.length?ww.map(e=>`<div class="ww"><div><b>${esc(e.tm8)}</b> <span class="sub">${e.st} tonight · ${e.mpg[0]} mpg in 2025-26</span></div>${e.go?`<div class="tw"><table class="mt"><tr><th></th>${["PTS","REB","AST","PRA"].map(m=>`<th>${m}</th>`).join("")}<th>Games</th></tr><tr><td>With</td>${["PTS","REB","AST","PRA"].map(m=>`<td>${e.avg[m][0]??"–"}</td>`).join("")}<td>${e.gw}</td></tr><tr><td>Without</td>${["PTS","REB","AST","PRA"].map(m=>{const a=e.avg[m];const d=a[0]!=null&&a[1]!=null?a[1]-a[0]:null;return `<td>${a[1]??"–"}${d!=null&&Math.abs(d)>=1?` <small class="${d>0?"up":"dn"}">${d>0?"+":""}${d.toFixed(1)}</small>`:""}</td>`}).join("")}<td>${e.go}${e.go<SMALL?' <small>small</small>':""}</td></tr></table></div>${qs.length?`<p class="sub">${qs.map(p=>{const x=e.props[`${p.m}|${p.side}|${p.line}`];return x?`${esc(lab(p))}: with ${x[0]}/${x[1]}, without ${x[2]}/${x[3]}`:""}).filter(Boolean).join(" · ")}</p>`:""}`:`<p class="sub">No 24+ min games without him on the same team in 2025-26 or 2026-27.</p>`}</div>`).join(""):`<p class="sub">No key teammate (20+ mpg) is Out or Questionable tonight.</p>`}</section>`;
 const a=FB[pl.team]||pl.team,b=o,tv=MU.tvt[[a,b].sort().join("|")];
 if(tv){const ctx=tv.ctx;h+=`<section><h4>Team H2H · ${pl.team} vs ${pl.opp}</h4>${tv.games.length?`<ul class="h2">${tv.games.slice().reverse().map(g=>{const t=[g[2],g[3]],w=t[0][1]>t[1][1]?t[0]:t[1];const me=t.find(x=>x[0]===a),op=t.find(x=>x[0]===b);return `<li><span class="sub">${g[0]}</span> <b class="${me[1]>op[1]?"up":"dn"}">${me[1]>op[1]?"W":"L"}</b> ${pl.team} ${me[1]}–${op[1]} ${me[2]==="home"?"vs":"@"} ${pl.opp}</li>`}).join("")}</ul>`:`<p class="sub">No meetings since 2025-26.</p>`}
 <div class="tw"><table class="mt"><tr><th></th><th>Pace 26-27</th><th>DRtg 26-27</th><th>Pace 25-26</th><th>DRtg 25-26</th></tr>${[a,b].map(x=>`<tr><td>${x}</td>${["2027","2026"].map(y=>{const c=ctx[x][y];return c?`<td>${c.pace[0]} <small>${ord(c.pace[1])}</small></td><td>${c.drtg[0]} <small>${ord(c.drtg[1])}</small></td>`:"<td>–</td><td>–</td>"}).join("")}</tr>`).join("")}</table></div></section>`}
 return h+`<p class="sub">Sources: ESPN box scores (${MU.meta.games?MU.meta.games["2026"]+" + "+MU.meta.games["2027"]+" games":""}) with Basketball-Reference positions; pace & DRtg from Basketball-Reference. Built ${MU.meta.built||""}.</p>`}
function parlays(){const Ps=C.parlays||[];if(!Ps.length)return"";const P=Ps.find(p=>p.name===S.par)||Ps[0];
 const calc=Q=>{const legs=Q.legs.map(([n,m,t])=>D.props.find(p=>p.player===n&&p.m===m&&p.line===t&&(p.side==="L"||p.side==="O")));return{legs,d:legs.reduce((s,p)=>s*(p?dec(p.odds):1),1)}};
 const {legs,d}=calc(P);
 return `<div class="par"><div class="t"><div class="seg">${Ps.map(Q=>`<button class="${Q===P?"on":""}" data-par="${Q.name}">${Q.name}</button>`).join("")}</div><span class="sub">${legs.length} legs · now ${amer(d)} · $10 pays $${(10*d).toFixed(2)}</span><button class="lnk" data-load="${P.name}">Load in slip</button></div>
 <ol>${legs.map((p,i)=>p?`<li>${esc(p.player)} ${esc(lab(p))} <b>${fmt(p.odds)}</b> <span>· ${p.hits}/${p.games} · H2H ${rec(p.h2h)}, all ${rec(p.h2a)}</span> ${chips(p.player,p)}</li>`:`<li>${esc(P.legs[i].join(" "))} <span>· line no longer listed</span></li>`).join("")}</ol></div>`}
function render(){const games=[...new Set(Object.values(D.players).map(p=>p.game))].sort((a,b)=>tipm(D.players[Object.keys(D.players).find(n=>D.players[n].game===a)].tip)-tipm(D.players[Object.keys(D.players).find(n=>D.players[n].game===b)].tip));
 let names=Object.keys(D.players).filter(n=>(S.game==="All"||D.players[n].game===S.game)&&(!S.q||n.toLowerCase().includes(S.q))&&(S.showOut||!OUT.has(n)));
 names.sort((a,b)=>tipm(D.players[a].tip)-tipm(D.players[b].tip)||D.players[a].game.localeCompare(D.players[b].game)||a.localeCompare(b));
 const cards=names.map(card).filter(Boolean);
 $("games").innerHTML=["All",...games].map(g=>`<button class="${S.game===g?"on":""}" data-game="${g}">${g==="All"?"All games":g}</button>`).join("");
 $("cards").innerHTML=cards.length?cards.join(""):`<div class="empty">No players match these filters.</div>`;
 $("cnt").textContent="· "+cards.length;$("pars").innerHTML=parlays();slip()}
function slip(){const legs=S.slip.map(i=>D.props[i]);const d=legs.reduce((s,p)=>s*dec(p.odds),1);const known=legs.every(p=>p.hit!=null);
 const pr=legs.reduce((s,p)=>s*(p.hit==null?1:(p.hits+1)/(p.games+2)),1);
 $("sl").innerHTML=legs.length?`<b>${legs.length} legs · ${amer(d)}</b><span class="sub">$${S.stake} pays $${(S.stake*d).toFixed(2)}</span>`:`<span class="sub">Bet slip is empty. Tap + on a prop.</span>`;
 const names=legs.map(p=>p.player),dup=[...new Set(names.filter((n,i)=>names.indexOf(n)!==i))],outs=[...new Set(names.filter(n=>OUT.has(n)||QST.has(n)))];
 $("sbody").innerHTML=legs.map(p=>`<div class="leg"><div><b>${esc(p.player)}</b> ${esc(lab(p))}<div class="sub">${p.game} · ${p.hit==null?"no hit rate":p.hits+"/"+p.games+" · H2H "+rec(p.h2h)+", all "+rec(p.h2a)}</div></div><b style="margin-left:auto">${fmt(p.odds)}</b><button class="x" data-add="${p.id}">×</button></div>`).join("")+
 (legs.length?`<div class="sum"><div><span>Combined</span><b>${amer(d)}</b></div><div><span>Stake $</span><input id="stake" type="number" min="0" value="${S.stake}"></div><div><span>Payout</span><b id="pay">$${(S.stake*d).toFixed(2)}</b></div><div><span>Est. all-hit</span><b>${known?(pr*100).toFixed(1)+"%":"n/a"}</b></div><div><button class="lnk" id="clr">Clear</button></div></div>`:"")+
 (dup.length?`<div class="warn">Same player twice: ${esc(dup.join(", "))}.</div>`:"")+(outs.length?`<div class="warn">Injury listed: ${esc(outs.join(", "))}.</div>`:"")+(legs.length&&!known?`<div class="warn">Est. all-hit excludes Specials (no hit rate).</div>`:"");
 if($("stake"))$("stake").oninput=e=>{S.stake=+e.target.value||0;$("pay").textContent="$"+(S.stake*d).toFixed(2)};if($("clr"))$("clr").onclick=e=>{e.stopPropagation();S.slip=[];render()}}
document.body.innerHTML=`<header><h1>Delta Props</h1><span class="stamp">NBA · ${C.date} · FanDuel odds ${C.odds_time} · Injury report ${C.inj_time}</span></header><main>
<div class="h">Tonight's parlays</div><div id="pars"></div>
<div class="h">Players <span id="cnt"></span></div>
<div class="bar"><div class="seg" id="games"></div></div>
<div class="bar"><input type="search" id="q" placeholder="Search player"><select id="mkt"><option value="All">All props</option>${MO.map(m=>`<option value="${m}">${MN[m]}</option>`).join("")}</select>
<select id="min">${[85,90,95,100].map(v=>`<option value="${v}">${v}%+ hit</option>`).join("")}</select>
${D.lite?"":`<label><input type="checkbox" id="qual" checked> Qualifying only</label>`}<label><input type="checkbox" id="soft"> Soft matchup</label><label><input type="checkbox" id="showOut"> Show OUT</label></div>
<div class="grid" id="cards"></div>
<details><summary>Injuries (official NBA report, ${C.inj_time})</summary><ul>${(C.inj||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>
<details><summary>How to read this</summary><p>Each card shows one line per prop type: the best-priced FanDuel line at or above the chosen hit-rate threshold, or FanDuel's main line when "Qualifying only" is off. Hit = regular-season games with 24+ minutes in 2025-26 and 2026-27 (Basketball-Reference, through ${C.logs_through}). H2H 24+ = those games vs tonight's opponent; all = every game played vs them, any minutes. "Qualifying" = your parlay rules: hit rate at or above the chosen threshold over at least 10 games, line above 5, odds between -300 and -5000. Over X.5 counts X+1 or more; Under X.5 counts X or fewer. Est. all-hit = product of (hits+1)/(games+2), legs treated as independent. Odds scraped ${C.odds_time}; lines move. Matchup chips: Soft/Tough = tonight's opponent ranks 1st–10th / 21st–30th in 2026-27 (to date) at allowing that stat to the player's position (ESPN box scores, Basketball-Reference positions). Boost chip = a key teammate is Out or Questionable and the player averaged more in 24+ min games without him; g = small sample. Research only; nothing here places a bet.${D.lite?" Lite version: qualifying props and parlay legs only, last 10 games per player; the full site has every line and full logs.":""}</p></details>
</main><div id="slip"><div id="sb"><div id="sl" style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"></div><span class="sub" style="margin-left:auto" id="chev">▲</span></div><div id="sbody"></div></div>`;
document.addEventListener("click",e=>{const t=e.target;let x;
 if(x=t.closest("[data-add]")){e.stopPropagation();const id=+x.dataset.add;S.slip=S.slip.includes(id)?S.slip.filter(i=>i!==id):[...S.slip,id];render();return}
 if(x=t.closest("[data-par]")){S.par=x.dataset.par;render();return}
 if(x=t.closest("[data-game]")){S.game=x.dataset.game;render();return}
 if(x=t.closest("[data-more]")){const[n,k]=x.dataset.more.split("|");const o=S.more[n]||(S.more[n]={});o.t=o.t===k?null:k;render();return}
 if(x=t.closest("[data-lm]")){const[n,m]=x.dataset.lm.split("|");S.more[n].m=m;render();return}
 if(x=t.closest("[data-load]")){const P=C.parlays.find(p=>p.name===x.dataset.load);S.slip=P.legs.map(([n,m,l])=>D.props.find(p=>p.player===n&&p.m===m&&p.line===l&&(p.side==="L"||p.side==="O"))).filter(Boolean).map(p=>p.id);$("slip").classList.add("open");$("chev").textContent="▼";render();return}
 if(t.closest("#sb")){$("slip").classList.toggle("open");$("chev").textContent=$("slip").classList.contains("open")?"▼":"▲"}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
 if(d.gm){S.gl[d.gm]={m:t.value,line:null}}else if(d.gl){S.gl[d.gl].line=+t.value}else if(d.gs){S.gs=t.value}else if(d.g24){S.g24=t.checked}
 else if(t.id==="mkt")S.mkt=t.value;else if(t.id==="min")S.min=+t.value;else if(t.id==="qual")S.qual=t.checked;else if(t.id==="soft")S.soft=t.checked;else if(t.id==="showOut")S.showOut=t.checked;else return;render()});
$("q").oninput=e=>{S.q=e.target.value.toLowerCase();render()};
const hs=location.hash;if(hs.startsWith("#gl:")||hs.startsWith("#lad:")||hs.startsWith("#mu:")){const[k,n]=decodeURIComponent(hs.slice(1)).split(":");S.more[n]={t:k};S.q=n.toLowerCase();$("q").value=n;}
render();
if(hs==="#demo")document.querySelector("[data-load]").click();
</script>
</body></html>
