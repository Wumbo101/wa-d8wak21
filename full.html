<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Delta Props · NBA · Tue Nov 24, 2026</title>
<style>
:root{
  --bg:#0d1015; --bg2:#12161c; --card:#161b23; --card2:#1e242e; --line:#262d38; --line2:rgba(38,45,56,.65);
  --tx:#f3f5f8; --tx2:#a7b0bf; --tx3:#6f7a8b;
  --acc:#7c9cff; --acc-bg:rgba(124,156,255,.13);
  --good:#34d399; --good-bg:rgba(52,211,153,.13);
  --mid:#fbbf24;  --mid-bg:rgba(251,191,36,.13);
  --bad:#f87171;  --bad-bg:rgba(248,113,113,.13);
  --r:18px; --r2:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + var(--safe-b));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.86);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.3px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7c9cff,#b18cff);display:grid;place-items:center;font-style:normal;font-size:16px;color:#0d1015;font-weight:800}
.hd .meta{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.35;color:var(--tx3)}
.hd .meta b{display:block;color:var(--tx);font-weight:600;font-size:14px}

/* layout */
main{padding-top:20px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.sec-h h2{font-size:22px;font-weight:750;letter-spacing:-.4px}
.sec-h .sub{font-size:14px;color:var(--tx3)}
section{margin-bottom:32px}
@media (max-width:1023px){
  body[data-tab="parlays"] #s-props, body[data-tab="parlays"] #s-inj,
  body[data-tab="props"] #s-parlays, body[data-tab="props"] #s-inj,
  body[data-tab="inj"] #s-parlays, body[data-tab="inj"] #s-props{display:none}
}
@media (min-width:1024px){
  body{padding-bottom:40px}
  main{padding-top:28px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
  #s-parlays{grid-column:1 / -1}
  #s-inj{position:sticky;top:84px}
}

/* avatar */
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card2);overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--tx2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:56px;height:56px;font-size:17px}
.av.sm{width:34px;height:34px;font-size:12px}

/* hit rate: big number + thin bar */
.hr{flex:none;width:62px;text-align:right}
.hr b{display:block;font-size:18px;font-weight:750;letter-spacing:-.3px;line-height:1.1}
.hr i{display:block;height:4px;border-radius:2px;background:var(--card2);margin-top:5px;overflow:hidden;position:relative}
.hr i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:currentColor;border-radius:2px}
.c-g{color:var(--good)} .c-m{color:var(--mid)} .c-b{color:var(--bad)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;vertical-align:2px;margin-left:6px}
.tag.out{color:var(--bad);background:var(--bad-bg)} .tag.q{color:var(--mid);background:var(--mid-bg)}
.tag.pk{color:var(--acc);background:var(--acc-bg);margin-left:0}

/* parlays */
.parlays{display:grid;gap:16px}
@media (min-width:760px){.parlays{grid-template-columns:1fr 1fr}}
.pl{background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(124,156,255,.22),0 10px 30px -12px rgba(0,0,0,.6)}
.pl-top{display:flex;align-items:flex-end;gap:12px;padding:20px 20px 18px;background:radial-gradient(120% 140% at 0% 0%,rgba(124,156,255,.20),transparent 60%),radial-gradient(90% 120% at 100% 0%,rgba(177,140,255,.14),transparent 60%)}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--acc);letter-spacing:.02em}
.pl .hp{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--tx);letter-spacing:0;margin-left:8px;vertical-align:middle;white-space:nowrap}
.pl-odds{font-size:42px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin-top:2px}
.pay{margin-left:auto;text-align:right}
.pay small{display:block;font-size:12.5px;color:var(--tx2)}
.pay b{display:block;font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.1;color:var(--good)}
.pay span{font-size:12.5px;color:var(--tx3)}
.legs{list-style:none}
.leg{display:flex;align-items:center;gap:12px;padding:11px 20px;width:100%;text-align:left;border-top:1px solid var(--line2)}
.leg:hover,.leg:active{background:rgba(255,255,255,.025)}
.leg .nm{flex:1;min-width:0}
.leg .nm b{display:block;font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .nm span{display:block;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:550;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg)}
.selects{display:flex;gap:8px;margin-bottom:6px}
.sel{position:relative;flex:1;max-width:220px}
.sel select{width:100%;font:inherit;font-size:14px;font-weight:550;background:var(--card);color:var(--tx);border:0;border-radius:999px;padding:8px 32px 8px 14px;-webkit-appearance:none;appearance:none;cursor:pointer}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel small{position:absolute;left:-9999px}

/* board */
.game{margin-top:18px}
.game-h{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:8px 2px 12px}
.game-h b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.game-h .dim{font-size:14px}
.game-h .bo{font-size:13px;font-weight:650;padding:1px 7px;border-radius:6px;cursor:help;color:var(--dim,#999);background:rgba(255,255,255,.06)}.game-h .bo-g{color:#34d399;background:rgba(52,211,153,.12)}.game-h .bo-a{color:#fbbf24;background:rgba(251,191,36,.12)}.game-h .bo-r{color:#f87171;background:rgba(248,113,113,.12)}
.game-h .info{margin-left:auto;font-size:13.5px;color:var(--acc);font-weight:550}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.cards{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}}
.pc{background:var(--card);border-radius:var(--r);overflow:hidden;align-self:start}
.pc-h{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.pc-h .nm b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.pc-h .nm span{font-size:13px;color:var(--tx3)}
.rows{list-style:none}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 18px;border-top:1px solid var(--line2)}
.row:hover,.row:active{background:rgba(255,255,255,.025)}
.row .mk{flex:1;min-width:0}
.row .mk b{display:block;font-weight:650;font-size:15.5px}
.row .mk span{display:block;font-size:13px;color:var(--tx3);margin-top:1px}
.row .mk .tag{font-style:normal;margin-left:8px}
.empty{padding:40px 16px;text-align:center;color:var(--tx3)}

/* injuries */
.panel{background:var(--card);border-radius:var(--r);overflow:hidden}
.panel h3{font-size:13px;font-weight:650;padding:16px 18px 6px;color:var(--tx2);display:flex;gap:8px;align-items:center}
.panel h3 .tag{margin-left:0}
.ilist{list-style:none;padding:0 0 8px}
.ilist li{display:flex;align-items:center;gap:12px;padding:8px 18px}
.ilist .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.ilist .nm span{display:block;font-size:13px;color:var(--tx3);font-weight:400}
.tmh{padding:8px 18px 0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.ilist + .tmh{padding-top:12px}
details.notes{border-top:1px solid var(--line2)}
details.notes summary{list-style:none;padding:14px 18px;font-size:14px;font-weight:550;color:var(--acc);cursor:pointer}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::after{content:" ›";display:inline-block;transition:transform .2s}
details.notes[open] summary::after{transform:rotate(90deg)}
details.notes p{padding:0 18px 14px;font-size:14px;color:var(--tx2);line-height:1.55}
.stamp{font-size:12.5px;color:var(--tx3);padding:12px 4px;line-height:1.6}

/* tabs (mobile) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,22,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line2);display:flex;padding:6px 8px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:550;color:var(--tx3)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--tx)}
nav.tabs .badge{font-size:10px;background:var(--bad);color:#fff;border-radius:99px;padding:0 5px;margin-left:3px}
@media (min-width:1024px){nav.tabs{display:none}}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:90vh;background:var(--bg2);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.sheet .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:20px;line-height:34px;z-index:1}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 18px calc(24px + var(--safe-b))}
@media (min-width:1024px){
  .sheet{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:0;transform:translateX(102%);box-shadow:-10px 0 40px rgba(0,0,0,.5)}
  .sheet .grab{display:none}
  .sb{padding:24px 24px 32px}
}
.sh-h{display:flex;gap:14px;align-items:center;padding-right:44px;margin-bottom:18px}
.sh-h b{display:block;font-size:20px;font-weight:750;letter-spacing:-.3px}
.sh-h span{font-size:13.5px;color:var(--tx3)}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:6px}
.big .l{font-size:26px;font-weight:800;letter-spacing:-.6px}
.big .muted{font-size:17px}
.pnote{font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 22px}
.st{background:var(--card);border-radius:var(--r2);padding:11px 12px}
.st small{display:block;font-size:12px;color:var(--tx3)}
.st b{display:block;font-size:20px;font-weight:750;margin-top:1px;letter-spacing:-.3px}
.st span{font-size:12px;color:var(--tx2)}
.blk{margin-bottom:24px}
.blk h4{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.blk h4 .dim{font-weight:500;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:5px;height:128px;position:relative;padding:18px 52px 0 0;border-bottom:1px solid var(--line)}
.bar{flex:1;position:relative;border-radius:5px 5px 0 0;min-height:3px}
.bar.h{background:rgba(52,211,153,.72)} .bar.mi{background:rgba(248,113,113,.68)}
.bar em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;color:var(--tx2)}
.thr{position:absolute;left:0;right:0;height:0;border-top:2px dashed #fff;pointer-events:none;z-index:2;filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
.thr span{position:absolute;right:0;top:-11px;background:#fff;color:#0d1015;font-size:11px;font-weight:800;line-height:1;padding:4px 6px;border-radius:6px;white-space:nowrap}
.xl{display:flex;gap:5px;margin-top:5px;padding-right:52px}
.xl span{flex:1;text-align:center;font-size:10px;color:var(--tx3);line-height:1.25;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;font-weight:500;color:var(--tx3);text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line2)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td.v{font-weight:700}
.ok{color:var(--good)} .no{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:center;background:var(--card);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px}
.kv .k{color:var(--tx2)}
.kv .hd2{font-size:11.5px;color:var(--tx3);text-align:right}
.rk{font-size:12px;font-weight:650;padding:2px 7px;border-radius:6px;min-width:40px;text-align:center;display:inline-block}
.g{color:var(--good);background:var(--good-bg)} .m{color:var(--mid);background:var(--mid-bg)} .b{color:var(--bad);background:var(--bad-bg)}
.note{font-size:12.5px;color:var(--tx3);margin-top:8px;line-height:1.45}
.ww{background:var(--card);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;font-size:14px}
.ww .t1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ww .t1 b{font-weight:650}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split2 div{background:var(--bg2);border-radius:10px;padding:8px 10px}
.split2 small{display:block;font-size:11.5px;color:var(--tx3)}
.mtg{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
.more-link{font-size:14px;font-weight:550;color:var(--acc);cursor:pointer;list-style:none}
.more-link::-webkit-details-marker{display:none}
@media (max-width:1023px){body[data-tab] .layout>section{display:none!important}
 body[data-tab="parlays"] #s-parlays,body[data-tab="props"] #s-props,body[data-tab="inj"] #s-inj,body[data-tab="ranks"] #s-ranks,body[data-tab="rec"] #s-rec,body[data-tab="live"] #s-live{display:block!important}}
@media (min-width:1024px){#s-props,#s-ranks{grid-column:1}#s-rec{grid-column:1 / -1}#s-live{grid-column:1 / -1}#s-inj{grid-column:2;grid-row:4 / span 2}}
html,body{overflow-x:hidden}
.srch{width:100%;font:inherit;font-size:15px;background:var(--card);color:var(--tx);border:0;border-radius:999px;padding:10px 16px;margin-bottom:10px;outline:none}
.srch:focus{box-shadow:0 0 0 2px var(--acc)}
.selects{flex-wrap:wrap}
.tgl{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--tx2);padding:4px 4px}
.tgl input{accent-color:var(--acc);width:16px;height:16px}
.row .add,.lad .add{flex:none;width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:18px;font-weight:600;line-height:32px;text-align:center}
.add.in{background:var(--acc);color:#0d1015}
.row{padding-right:12px}
.more{display:block;width:100%;padding:12px 18px;border-top:1px solid var(--line2);font-size:14px;font-weight:550;color:var(--acc);text-align:left}
.qb{color:var(--good);background:var(--good-bg)}
.stabs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;margin:0 0 16px;position:sticky;top:-12px;z-index:3}
.stabs button{flex:1;padding:8px 6px;border-radius:999px;font-size:14px;font-weight:600;color:var(--tx2)}
.stabs button.on{background:var(--tx);color:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px;align-items:center}
.ctl .sel{flex:1 1 110px;max-width:none}
.sum{font-size:13.5px;color:var(--tx2);margin:6px 0 12px;line-height:1.5}.sum b{color:var(--tx)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.t.gl{font-size:13px;min-width:560px}table.t.gl td,table.t.gl th{padding:6px 5px}
table.t tr.gr td{color:var(--tx3)}
td.y{color:var(--good);font-weight:700}td.n{color:var(--bad);font-weight:700}
.lad h5{font-size:13.5px;font-weight:700;margin:16px 0 6px;color:var(--tx2)}
.lad table.t td{vertical-align:middle}
.rt td.me{color:var(--acc);font-weight:700}
.rt tr.tn td{background:rgba(124,156,255,.08)}
.slip{position:fixed;left:8px;right:8px;bottom:calc(72px + var(--safe-b));z-index:40;background:#1b2130;border:1px solid rgba(124,156,255,.35);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:560px;margin:0 auto}
.slip.on{display:block}

.slip .sh{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.slip .sh b{font-size:15px}.slip .sh .r{margin-left:auto;text-align:right;font-size:13px;color:var(--tx2)}.slip .sh .r b{color:var(--good);font-size:16px}
.slip ul{list-style:none;max-height:40vh;overflow:auto;border-top:1px solid var(--line2)}
.slip li{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.slip li span{flex:1;min-width:0}.slip li button{color:var(--bad);font-size:18px;width:28px}
.slip .ft{display:flex;gap:8px;padding:10px 14px}.slip .ft button{font-size:13.5px;color:var(--acc);font-weight:600}
.plbtn{font-size:13px;font-weight:600;color:var(--acc);padding:10px 20px 14px;display:block}
.ix{font-size:12.5px;color:var(--tx3);margin:6px 2px 0}
.itg{display:flex;align-items:center;gap:6px;margin:-4px 18px 8px auto;font-size:12px;font-weight:600;color:var(--acc);padding:3px 10px;border-radius:999px;background:var(--acc-bg)}
.itg .tag{margin-left:0;vertical-align:0}.itg.on{background:var(--card2)}
.rows li>.row{flex:1 1 0;min-width:0}
.tag.ln{background:rgba(255,255,255,.06)}
.ins{flex:1 1 100%;margin:0 12px 12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);font-size:13.5px;color:var(--tx2)}

function P_opp(p){return br((PLAYERS[p.player]||{}).opp);}
function frs(x){return x?'<b class="num c-'+hitCls(x[2])+'">'+x[2]+'%</b><span class="num">'+x[0]+'/'+x[1]+'</span>':'<b class="dim">–</b>';}
function verdict(p,o){
  if(!o.F||!o.F.length)return "";
  var nm=p.player.split(" ").slice(-1)[0],lb=propLabel(p),pos=o.F.filter(function(f){return f.p>0;}).sort(function(a,b){return b.p-a.p;}),neg=o.F.filter(function(f){return f.p<0;}).sort(function(a,b){return a.p-b.p;}),s=[];
  s.push("Score "+(o.sc>=0?"+":"")+o.sc+": "+nm+" "+lb+" at "+fmtOdds(p.odds)+(o.all?", hitting "+o.all[0]+" of "+o.all[1]+" ("+o.all[2]+"%) against "+p.imp+"% implied.":"."));
  if(pos.length)s.push("Biggest reasons for: "+pos.slice(0,3).map(function(f){return f.k+" ("+f.t+")";}).join("; ")+".");
  else s.push("Nothing in the data adds points for this line.");
  if(neg.length)s.push("Biggest risk: "+neg[0].k+" ("+neg[0].t+")"+(neg[1]?", followed by "+neg[1].k:"")+".");
  else if(o.lastMiss)s.push("Biggest risk: no factor scores against it, but the last miss was "+o.lastMiss[0]+" vs "+o.lastMiss[2]+(p.m==="DD"||p.m==="TD"?"":" with "+o.lastMiss[1]+" in "+o.lastMiss[3]+" min")+".");
  else s.push("Biggest risk: no factor scores against it and he has no misses in the sample, so the main risk is the thin price.");
  var ch=[];
  if(o.be!=null)ch.push(o.edge>=0?"the edge disappears if the price shortens past about "+fmtOdds(o.be):"it only has value at about "+fmtOdds(o.be)+" or longer");
  o.ww.forEach(function(w){if(/quest|doubt/i.test(w.st)&&w.a)ch.push("if "+w.tm+" sits, his average has gone from "+w.a[0]+" to "+w.a[1]);else if(/quest|doubt/i.test(w.st))ch.push("if "+w.tm+" sits, his role could change (no 24+ min sample without him)");});
  if(o.min[0]!=null&&o.min[1]!=null&&o.min[0]<o.min[1]-2)ch.push("a return to his "+o.min[1]+"-minute season average would help; another drop toward "+o.min[0]+" would hurt");
  if(QST.indexOf(p.player)>-1)ch.push("if he is limited or ruled out, the line voids or falls apart");
  if(!ch.length&&o.l10)ch.push("a cold run below "+o.l10[0]+"/10 in recent form would pull it down a tier");
  s.push("What would change the call: "+ch.slice(0,2).join("; ")+".");
  var gap=o.lean==="Strong"?o.sc-6:o.lean==="Lean"?Math.min(o.sc-3,6-o.sc):3-o.sc;
  s.push(o.lean==="Strong"?"It clears the Strong cutoff by "+gap+" point"+(gap===1?"":"s")+".":o.lean==="Lean"?"It sits "+(6-o.sc)+" point"+(6-o.sc===1?"":"s")+" below Strong and "+(o.sc-3)+" above Fade.":"It is "+gap+" point"+(gap===1?"":"s")+" short of Lean.");
  return s.join(" ");
}
function whyHtml(o){if(!o.F||!o.F.length)return "";

  o.F.forEach(function(f){var c=f.p>0?"up":f.p<0?"dn":"nt";h+='<details class="fx '+c+'"><summary><i></i><b>'+esc(f.k)+'</b><span class="num pt">'+(f.p>0?"+":f.p<0?"−":"±")+Math.abs(f.p)+'</span><span class="ft num">'+esc(f.t)+'</span></summary>'+(f.n?'<p class="dim">Rule: '+esc(f.n)+'</p>':'')+'</details>';});
  return h+'<div class="fx tot"><b>Total</b><span class="num pt">'+(o.sc>=0?"+":"")+o.sc+' → '+esc(o.lean)+'</span></div></div>';}
function ptPlain(v){return (v>0?"+":"−")+Math.abs(v);}
function ptPill(v){return '<span class="pp num '+(v>0?"up":v<0?"dn":"nt")+'">'+(v>0?"+":v<0?"−":"±")+Math.abs(v)+'</span>';}
function whyLine(p,o){
  if(!o.F||!o.F.length)return "";
  var pos=o.F.filter(function(f){return f.p>0;}).sort(function(a,b){return b.p-a.p;}),neg=o.F.filter(function(f){return f.p<0;}).sort(function(a,b){return a.p-b.p;});
  var nm=p.player.split(" ").slice(-1)[0],H=o.all?o.all[2]:null,edgeF=o.F.filter(function(f){return f.k==="Edge vs price";})[0];
  var thin=H!=null&&H>=85&&edgeF&&edgeF.p<=0,priceDriven=thin&&o.lean!=="Strong";
  var s=o.lean+": ";
  if(o.all)s+=nm+" hits "+Math.round(H)+"%";
  if(priceDriven&&has(p.imp))s+=" but at "+fmtOdds(p.odds)+" the price already implies "+Math.round(p.imp)+"%, so there's little value"+(o.edge!=null?" ("+(o.edge>=0?"+":"−")+Math.abs(o.edge)+" edge)":"");
  else if(pos.length)s+=(o.all?", helped most by ":"Helped most by ")+pos[0].k.toLowerCase()+" ("+ptPlain(pos[0].p)+")";
  var n2=neg.filter(function(f){return !(priceDriven&&f.k==="Edge vs price");});
  if(n2.length)s+=", and the biggest drag is "+n2[0].k.toLowerCase()+" ("+ptPlain(n2[0].p)+": "+n2[0].t+")";
  else if(!priceDriven)s+=", with nothing scoring against it";
  if(thin&&!priceDriven&&has(p.imp))s+="; the "+fmtOdds(p.odds)+" price already implies "+Math.round(p.imp)+"%, so the value is thin";
  s+=".";
  if(o.lean==="Fade")s+=priceDriven?" This Fade is about price, not performance.":" This Fade is performance-driven.";
  return s;}
function qcard(lbl,val,sub,cls){return '<div class="qc"><small>'+lbl+'</small><b class="num'+(cls?" c-"+cls:"")+'">'+val+'</b>'+(sub?'<span class="num">'+sub+'</span>':'')+'</div>';}

  if(o.F&&o.F.length){h+='<div class="sbk"><h5>Score breakdown</h5>';
    o.F.forEach(function(f){h+='<div class="sr"><div><b>'+esc(f.k)+'</b><span>'+esc(f.t)+'</span>'+(f.n?'<em class="dim">'+esc(f.n)+'</em>':'')+'</div>'+ptPill(f.p)+'</div>';});
    h+='<div class="sr tot"><div><b>Total</b><span class="dim">'+TIERS+'</span></div><span class="pp num tt c-'+c+'">'+(o.sc>=0?"+":"")+o.sc+' '+esc(o.lean||"")+'</span></div></div>';
    var cx=[],fk=function(pre){return o.F.filter(function(f){return f.k.indexOf(pre)===0;});};
    fk("Opp D").forEach(function(f){cx.push("Matchup ("+f.k.replace("Opp D","defense")+"): "+f.t);});

    fk("w/o").forEach(function(f){cx.push(f.k.replace("w/o","Without")+": "+f.t);});
    if(o.noww&&o.noww.length)cx.push("Teammates out, no games without them yet: "+o.noww.join(", "));
    fk("Misses").forEach(function(f){cx.push(f.t);});

    if(cx.length)h+='<div class="cx"><h5>Context</h5><ul>'+cx.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>';
    var pos=o.F.filter(function(f){return f.p>0;}).sort(function(a,b){return b.p-a.p;}),neg=o.F.filter(function(f){return f.p<0;}).sort(function(a,b){return a.p-b.p;});
    var up=o.lean==="Strong"?null:(o.lean==="Lean"?6-o.sc:3-o.sc),dn=o.lean==="Fade"?null:(o.lean==="Strong"?o.sc-5:o.sc-2);

    h+='<p><b>Biggest risk:</b> '+(neg.length?esc(neg[0].k+" — "+neg[0].t):o.lastMiss?esc("no factor scores against it; last miss "+o.lastMiss[0]+" vs "+o.lastMiss[2]):"none scored")+'</p>';
    h+='<p><b>What would change it:</b> '+esc((up!=null?"+"+up+" point"+(up===1?"":"s")+" moves it up to "+(o.lean==="Lean"?"Strong":"Lean"):"")+(up!=null&&dn!=null?"; ":"")+(dn!=null?"−"+dn+" point"+(dn===1?"":"s")+" drops it to "+(o.lean==="Strong"?"Lean":"Fade"):""))+'.</p></div>';}
  return h+'</div>';}

function bestRows(rows){
  var by={},order=[];rows.forEach(function(p){if(!by[p.m]){by[p.m]=[];order.push(p.m);}by[p.m].push(p);});
  var out=[];order.sort(function(a,b){return MK_ORDER.indexOf(a)-MK_ORDER.indexOf(b);}).forEach(function(m){
    if(m==="SPEC")return;var a=by[m];
    var q=a.filter(isQ).sort(function(x,y){return y.odds-x.odds;});
    if(q.length){out.push(q[0]);return;}
    var o=a.filter(function(p){return p.side==="O";});if(o.length){out.push(o[0]);return;}
    var l=a.filter(function(p){return p.side==="L"||p.side==="Y";}).sort(function(x,y){return Math.abs(x.odds+110)-Math.abs(y.odds+110);});if(l.length)out.push(l[0]);
  });return out;}

 var rt='<span class="pill '+e.result+'">'+RL[e.result]+'</span>'+(e.result!=="pending"&&e.profit!=null?'<b class="num '+(e.profit>=0?"c-g":"c-b")+'">'+mn(e.profit)+'</b>':'');
 return '<div class="tk"><div class="tk-h"><b>'+E(name)+'</b><span class="od">'+od(e.price)+'</span>'+(e.hp!=null&&e.te?'<span class="hp" title="'+E((e.tn||"")+" · est. chance to hit"+(e.hb&&e.hb!=="at_entry"?" (estimated at entry, backfilled)":""))+'">'+E(e.te)+' '+Math.round(e.hp)+'%</span>':'')+'<span class="tm">'+E([e.t,pay.replace(" · ","")].filter(Boolean).join(" · "))+'</span><span class="rt">'+rt+'</span></div><ul class="tl">'+e.legs.map(leg).join("")+'</ul>'+(e.note?'<div class="note">'+E(e.note)+'</div>':'')+'</div>';}
function recRow(r){var s=r.s,z=!s.n,g=s.w+s.l,hp=g?Math.round(s.w/g*100)+"%":"–";return '<tr class="'+(z?"z":"")+'"><td>'+E(r.name)+'</td><td>'+s.w+'–'+s.l+(s.p?'–'+s.p:'')+'</td><td>'+hp+'</td><td>'+(s.pend||"")+'</td><td class="'+(z||!s.staked?"":s.net>=0?"c-g":"c-b")+'">'+(s.staked?mn(s.net):"–")+'</td><td>'+(s.roi==null?"–":s.roi.toFixed(1)+"%")+'</td><td>'+(s.lc?Math.round(s.lh/s.lc*100)+"%":"–")+'</td></tr>';}
function recTable(){var h='<div class="ovx"><table class="rt-tbl"><tr><th>Pipeline</th><th>W–L</th><th>Hit%</th><th>Open</th><th>Net</th><th>ROI</th><th>Legs</th></tr>',g=null;
 S.rec.forEach(function(r){if(r.grp!==g){g=r.grp;h+='<tr><td class="grp" colspan="7">'+E(g)+'</td></tr>';}h+=recRow(r);});return h+'</table></div><p class="note">$10 per ticket. W–L and Hit% count graded tickets (pushes ignored in Hit%). Open = recorded, not graded yet. Legs = graded leg hit rate. CBB short-odds (−125..−105) is a paper hit-rate test next to the +100-min lanes; profit is secondary.</p>';}
function tot(keys){var t={w:0,l:0,pend:0,net:0,st:0};S.rec.forEach(function(r){if(keys(r.k)){t.w+=r.s.w;t.l+=r.s.l;t.pend+=r.s.pend;t.net+=r.s.net;t.st+=r.s.staked;}});return t;}
function kpi(lab,t){return '<div><small>'+E(lab)+'</small><b>'+t.w+'–'+t.l+'</b><span class="'+(t.net>=0?"c-g":"c-b")+'">'+(t.st?mn(t.net):"–")+'</span>'+(t.pend?'<span> · '+t.pend+' open</span>':'')+'</div>';}
function byDay(L,d){return L.filter(function(e){return e.date===d;});}
function latest(L){return L.length?L.map(function(e){return e.date;}).sort().pop():null;}
var GN={live:"CBB live",live_short:"CBB live short",sgp:"CBB SGP",sgp_short:"CBB SGP short",pre:"CBB pregame",pre_short:"CBB pregame short"};
function cbbLab(e){return GN[e.grp]||e.grp;}
function hitCmp(aKey,bKey,al,bl){var A=S.rec.filter(function(r){return r.k===aKey;})[0],B=S.rec.filter(function(r){return r.k===bKey;})[0];
 function bits(r,lab){if(!r)return lab+": –";var s=r.s,g=s.w+s.l,tp=g?Math.round(s.w/g*100)+"%":"n/a",lp=s.lc?Math.round(s.lh/s.lc*100)+"%":"n/a";return lab+": tickets "+s.w+"–"+s.l+" ("+tp+") · legs "+(s.lh||0)+"/"+(s.lc||0)+" ("+lp+")";}
 return '<div class="note">'+E(bits(A,al)+"  vs  "+bits(B,bl))+'</div>';}
function dash(){var el=document.getElementById("v-dash"),T=S.today,h='<div class="sec-h"><h2>Dashboard</h2><span class="sub">'+E(fd(T))+(S.odds_time?' · NBA odds '+E(S.odds_time):'')+'</span></div>';
 h+='<div class="kp">'+kpi("All pipelines",tot(function(){return 1;}))+kpi("NBA pregame",tot(function(k){return k.indexOf("nba_")===0&&k!=="nba_live"&&k!=="nba_trial"&&k!=="nba_lpp";}))+kpi("NBA live",tot(function(k){return k==="nba_live"||k==="nba_trial"||k==="nba_lpp";}))+kpi("CBB",tot(function(k){return k.indexOf("cbb_")===0;}))+kpi("NFL",tot(function(k){return k.indexOf("nfl_")===0;}))+'</div>';
 h+='<div class="dgrid">';
 var np=byDay(S.pre,T),nl=byDay(S.live,T),lp=byDay(S.lpp,T);
 h+='<div class="pan"><h3>Tonight\'s NBA tickets<a class="go" href="#nba" data-view="nba">NBA Props ›</a></h3>'+(np.length?np.map(function(e){return ticket(e,e.tier);}).join(""):'<div class="empty2">No NBA pregame tickets recorded for today.</div>')+'</div>';
 h+='<div class="pan"><h3>NBA live tonight<a class="go" href="#nba" data-view="nba" data-jump="live">Live ›</a></h3>'+((nl.length||lp.length)?nl.slice().reverse().map(function(e){return ticket(e,e.trial?"Game parlay · trial":"Game parlay");}).join("")+lp.slice().reverse().map(function(e){return ticket(e,"Player props");}).join(""):'<div class="empty2">No NBA live tickets yet today.</div>')+'</div>';
 var cb=byDay(S.cbb,T);
 h+='<div class="pan wide"><h3>Today\'s CBB tickets <span class="pill k">'+cb.length+'</span><a class="go" href="#cbb" data-view="cbb">CBB Live ›</a></h3>'+(cb.length?'<div class="dgrid">'+cb.slice().reverse().map(function(e){return '<div>'+ticket(e,GN[e.grp])+'</div>';}).join("")+'</div>':'<div class="empty2">No CBB tickets recorded today.</div>')+'</div>';
 h+='<div class="pan wide"><h3>Records<a class="go" href="#records" data-view="records">All records ›</a></h3>'+recTable()+'</div>';
 h+='<div class="pan wide"><h3>Quick links</h3><div class="ql"><a href="#nba" data-view="nba" data-jump="parlays">NBA parlays</a><a href="#nba" data-view="nba" data-jump="props">Player props</a>'+(document.getElementById("s-ou")?'<a href="#nba" data-view="nba" data-jump="ou">Player O/U</a>':'')+'<a href="#nba" data-view="nba" data-jump="ranks">Team ranks</a><a href="#nba" data-view="nba" data-jump="inj">Injuries</a><a href="#records" data-view="records">Records</a><a href="#cbb" data-view="cbb">CBB Live</a><a href="#nfl" data-view="nfl">NFL Live</a></div></div>';
 el.innerHTML=h+'</div><p class="note">Paper picks for research only, never a wager. Built '+E(S.built)+'.</p>';}
var RS={tab:"nba",pg:{}};
function list(L,name,key,per){per=per||4;L=L.slice().sort(function(a,b){return (a.date+(a.t||""))<(b.date+(b.t||""))?1:-1;});var n=Math.max(1,Math.ceil(L.length/per)),p=Math.min(RS.pg[key]||0,n-1);RS.pg[key]=p;
 if(!L.length)return '<div class="empty2">No tickets recorded yet.</div>';
 var h=L.slice(p*per,p*per+per).map(function(e){return ticket(e,(typeof name==="function"?name(e):name)+" · "+fd(e.date));}).join("");
 if(n>1)h+='<div class="pg"><button data-pgk="'+key+'" data-pgd="-1"'+(p<=0?" disabled":"")+'>‹ Previous</button><span>Page '+(p+1)+' of '+n+'</span><button data-pgk="'+key+'" data-pgd="1"'+(p>=n-1?" disabled":"")+'>Next ›</button></div>';return h;}
function subRec(keys){return '<div class="ovx"><table class="rt-tbl"><tr><th>Type</th><th>W–L</th><th>Hit%</th><th>Open</th><th>Net</th><th>ROI</th><th>Legs</th></tr>'+S.rec.filter(function(r){return keys.indexOf(r.k)>=0;}).map(recRow).join("")+'</table></div>';}
function records(){var el=document.getElementById("v-records"),rec=document.getElementById("s-rec");
 var h='<div class="sec-h"><h2>Records</h2><span class="sub">every pipeline, kept separate</span></div><div class="pan">'+recTable()+'</div>';
 h+='<div class="segs" style="margin-top:20px">'+[["nba","NBA pregame + live"],["cbb","CBB"],["nfl","NFL"]].map(function(t){return '<button data-rtab="'+t[0]+'" class="'+(RS.tab===t[0]?"on":"")+'">'+t[1]+'</button>';}).join("")+'</div><div id="rbody"></div>';
 if(!el.dataset.init){el.innerHTML=h;el.dataset.init=1;if(rec)el.appendChild(rec);}else{el.querySelector(".segs").outerHTML=h.match(/<div class="segs"[\s\S]*?<\/div>/)[0];}
 var b=document.getElementById("rbody"),x="";
 if(RS.tab==="cbb"){x='<div class="pan"><h3>CBB live cross-game</h3>'+list(S.cbb.filter(function(e){return e.grp==="live";}),"Live","cbbl")+'</div><div class="pan" style="margin-top:14px"><h3>CBB live short −125..−105</h3>'+list(S.cbb.filter(function(e){return e.grp==="live_short";}),"Live short","cbbls")+'</div><div class="pan" style="margin-top:14px"><h3>CBB SGP</h3>'+list(S.cbb.filter(function(e){return e.grp==="sgp";}),"SGP","cbbs")+'</div><div class="pan" style="margin-top:14px"><h3>CBB SGP short −125..−105</h3>'+list(S.cbb.filter(function(e){return e.grp==="sgp_short";}),"SGP short","cbbss")+'</div><div class="pan" style="margin-top:14px"><h3>CBB pregame</h3>'+list(S.cbb.filter(function(e){return e.grp==="pre";}),"Pregame","cbbp")+'</div><div class="pan" style="margin-top:14px"><h3>CBB pregame short −125..−105</h3>'+list(S.cbb.filter(function(e){return e.grp==="pre_short";}),"Pregame short","cbbps")+'</div>';}
 else if(RS.tab==="nfl"){x='<div class="pan"><h3>NFL live cross-game</h3>'+list(S.nfl.filter(function(e){return e.grp==="live";}),"Live","nfll")+'</div><div class="pan" style="margin-top:14px"><h3>NFL SGP</h3>'+list(S.nfl.filter(function(e){return e.grp==="sgp";}),"SGP","nfls")+'</div>';}
 b.innerHTML=x;if(rec)rec.style.display=RS.tab==="nba"?"":"none";}
function cbb(){var el=document.getElementById("v-cbb"),d=latest(S.cbb),T=d||S.today,L=byDay(S.cbb,T);
 var h='<div class="sec-h"><h2>CBB Live</h2><span class="sub">paper test · '+E(fd(T))+'</span></div>';
 h+='<div class="pan" style="margin-bottom:16px"><h3>Record</h3>'+subRec(["cbb_live","cbb_live_short","cbb_sgp","cbb_sgp_short","cbb_pre","cbb_pre_short"])+hitCmp("cbb_live","cbb_live_short","LIVE +100","LIVE SHORT")+hitCmp("cbb_sgp","cbb_sgp_short","SGP +120","SGP SHORT")+hitCmp("cbb_pre","cbb_pre_short","PREGAME +100..+200","PREGAME SHORT")+'</div>';
 var pre=L.filter(function(e){return e.grp==="pre"||e.grp==="pre_short";}),lv=L.filter(function(e){return e.grp!=="pre"&&e.grp!=="pre_short";});
 h+='<div class="dgrid"><div class="pan"><h3>Pregame tickets</h3>'+(pre.length?pre.map(function(e){return ticket(e,e.grp==="pre_short"?"Pregame short":"Pregame");}).join(""):'<div class="empty2">No pregame ticket on this day.</div>')+'</div>';
 h+='<div class="pan"><h3>Live tickets <span class="pill k">'+lv.length+'</span></h3>'+(lv.length?lv.slice().reverse().map(function(e){return ticket(e,cbbLab(e).replace("CBB ",""));}).join(""):'<div class="empty2">No live tickets on this day.</div>')+'</div></div>';
 var old=S.cbb.filter(function(e){return e.date!==T;});
 if(old.length)h+='<div class="pan" style="margin-top:16px"><h3>Earlier days</h3>'+list(old,function(e){return GN[e.grp];},"cbbo")+'</div>';
 h+='<p class="note">Leg results fill in when the CBB grading run grades the day from ESPN finals; until then tickets show Pending. Prices are calculated from FanDuel NY singles.</p>';
 el.innerHTML=h;}
function nfl(){var el=document.getElementById("v-nfl"),d=latest(S.nfl);
 var h='<div class="sec-h"><h2>NFL Live</h2><span class="sub">paper test'+(d?' · last tickets '+E(fd(d)):'')+'</span></div>';
 if(S.nfl_status)h+='<div class="banner">'+E(S.nfl_status)+'</div>';
 h+='<div class="pan" style="margin-bottom:16px"><h3>Record</h3>'+subRec(["nfl_live","nfl_sgp"])+'</div>';
 h+='<div class="pan"><h3>Tickets</h3>'+list(S.nfl,function(e){return e.grp==="sgp"?"SGP":"Cross-game";},"nflt")+'</div>';
 el.innerHTML=h;}
function setView(v,jump,noscroll){if(["dash","records","nba","cbb","nfl"].indexOf(v)<0)v="dash";B.dataset.view=v;B.classList.remove("sb-open");
 document.querySelectorAll("#sbar a[data-view],#mnav a[data-view]").forEach(function(a){a.classList.toggle("on",a.dataset.view===v);});
 if(v==="records")records();
 if(v==="nba"&&jump){var ok=document.getElementById("s-"+jump);
   if(window.innerWidth<1024){var tb=document.querySelector('#tabs [data-t="'+jump+'"]');if(tb)tb.click();}
   else if(ok){setTimeout(function(){ok.scrollIntoView({behavior:"smooth",block:"start"});},30);return;}}
 if(!noscroll)window.scrollTo(0,0);}
window.addEventListener("click",function(e){
 var g=e.target.closest("[data-gorec]");if(g){e.stopPropagation();e.preventDefault();RS.tab="nba";location.hash="records";return;}
 var a=e.target.closest("a[data-view],a[data-jump]");
 if(a&&(a.dataset.view||a.dataset.jump)){e.preventDefault();var v=a.dataset.view||"nba";if(("#"+v)!==location.hash)history.pushState(null,"","#"+v);setView(v,a.dataset.jump);return;}
 var r=e.target.closest("[data-rtab]");if(r){RS.tab=r.dataset.rtab;records();return;}
 var p=e.target.closest("[data-pgk]");if(p){RS.pg[p.dataset.pgk]=(RS.pg[p.dataset.pgk]||0)+(+p.dataset.pgd);var v2=B.dataset.view;if(v2==="records")records();else if(v2==="cbb")cbb();else if(v2==="nfl")nfl();return;}
},true);
document.getElementById("sbham").addEventListener("click",function(){B.classList.toggle("sb-open");});
document.getElementById("sbov").addEventListener("click",function(){B.classList.remove("sb-open");});
window.addEventListener("hashchange",function(){setView(location.hash.slice(1));});
window.addEventListener("popstate",function(){setView(location.hash.slice(1)||"dash");});
try{dash();cbb();nfl();records();}catch(err){console.error("sidebar render",err);}
setView(location.hash.slice(1)||"dash",null,true);
})();</script>
</body>
