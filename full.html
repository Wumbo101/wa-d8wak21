<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Delta Props · NBA · Thu Nov 5, 2026</title>
<style>
:root{
  --bg:#0d1015; --bg2:#12161c; --card:#161b23; --card2:#1e242e; --line:#262d38; --line2:rgba(38,45,56,.65);
  --tx:#f3f5f8; --tx2:#a7b0bf; --tx3:#6f7a8b;
  --acc:#7c9cff; --acc-bg:rgba(124,156,255,.13);
  --good:#34d399; --good-bg:rgba(52,211,153,.13);
  --mid:#fbbf24;  --mid-bg:rgba(251,191,36,.13);
  --bad:#f87171;  --bad-bg:rgba(248,113,113,.13);
  --r:18px; --r2:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(80px + var(--safe-b));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(13,16,21,.86);backdrop-filter:saturate(1.5) blur(16px);-webkit-backdrop-filter:saturate(1.5) blur(16px);
  border-bottom:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:19px;letter-spacing:-.3px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#7c9cff,#b18cff);display:grid;place-items:center;font-style:normal;font-size:16px;color:#0d1015;font-weight:800}
.hd .meta{margin-left:auto;text-align:right;font-size:12.5px;line-height:1.35;color:var(--tx3)}
.hd .meta b{display:block;color:var(--tx);font-weight:600;font-size:14px}

/* layout */
main{padding-top:20px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
.sec-h h2{font-size:22px;font-weight:750;letter-spacing:-.4px}
.sec-h .sub{font-size:14px;color:var(--tx3)}
section{margin-bottom:32px}
@media (max-width:1023px){
  body[data-tab="parlays"] #s-props, body[data-tab="parlays"] #s-inj,
  body[data-tab="props"] #s-parlays, body[data-tab="props"] #s-inj,
  body[data-tab="inj"] #s-parlays, body[data-tab="inj"] #s-props{display:none}
}
@media (min-width:1024px){
  body{padding-bottom:40px}
  main{padding-top:28px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
  #s-parlays{grid-column:1 / -1}
  #s-inj{position:sticky;top:84px}
}

/* avatar */
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--card2);overflow:hidden;display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--tx2)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:56px;height:56px;font-size:17px}
.av.sm{width:34px;height:34px;font-size:12px}

/* hit rate: big number + thin bar */
.hr{flex:none;width:62px;text-align:right}
.hr b{display:block;font-size:18px;font-weight:750;letter-spacing:-.3px;line-height:1.1}
.hr i{display:block;height:4px;border-radius:2px;background:var(--card2);margin-top:5px;overflow:hidden;position:relative}
.hr i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:currentColor;border-radius:2px}
.c-g{color:var(--good)} .c-m{color:var(--mid)} .c-b{color:var(--bad)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;vertical-align:2px;margin-left:6px}
.tag.out{color:var(--bad);background:var(--bad-bg)} .tag.q{color:var(--mid);background:var(--mid-bg)}
.tag.pk{color:var(--acc);background:var(--acc-bg);margin-left:0}

/* parlays */
.parlays{display:grid;gap:16px}
@media (min-width:760px){.parlays{grid-template-columns:1fr 1fr}}
.pl{background:var(--card);border-radius:var(--r);overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(124,156,255,.22),0 10px 30px -12px rgba(0,0,0,.6)}
.pl-top{display:flex;align-items:flex-end;gap:12px;padding:20px 20px 18px;background:radial-gradient(120% 140% at 0% 0%,rgba(124,156,255,.20),transparent 60%),radial-gradient(90% 120% at 100% 0%,rgba(177,140,255,.14),transparent 60%)}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--acc);letter-spacing:.02em}
.pl-odds{font-size:42px;font-weight:800;letter-spacing:-1.2px;line-height:1.05;margin-top:2px}
.pay{margin-left:auto;text-align:right}
.pay small{display:block;font-size:12.5px;color:var(--tx2)}
.pay b{display:block;font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.1;color:var(--good)}
.pay span{font-size:12.5px;color:var(--tx3)}
.legs{list-style:none}
.leg{display:flex;align-items:center;gap:12px;padding:11px 20px;width:100%;text-align:left;border-top:1px solid var(--line2)}
.leg:hover,.leg:active{background:rgba(255,255,255,.025)}
.leg .nm{flex:1;min-width:0}
.leg .nm b{display:block;font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .nm span{display:block;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* filters */
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:2px 16px}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;font-weight:550;padding:8px 14px;border-radius:999px;background:var(--card);color:var(--tx2);white-space:nowrap}
.chip.on{background:var(--tx);color:var(--bg)}
.selects{display:flex;gap:8px;margin-bottom:6px}
.sel{position:relative;flex:1;max-width:220px}
.sel select{width:100%;font:inherit;font-size:14px;font-weight:550;background:var(--card);color:var(--tx);border:0;border-radius:999px;padding:8px 32px 8px 14px;-webkit-appearance:none;appearance:none;cursor:pointer}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.sel small{position:absolute;left:-9999px}

/* board */
.game{margin-top:18px}
.game-h{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:8px 2px 12px}
.game-h b{font-size:17px;font-weight:700;letter-spacing:-.2px}
.game-h .dim{font-size:14px}
.game-h .bo{font-size:13px;font-weight:650;padding:1px 7px;border-radius:6px;cursor:help;color:var(--dim,#999);background:rgba(255,255,255,.06)}.game-h .bo-g{color:#34d399;background:rgba(52,211,153,.12)}.game-h .bo-a{color:#fbbf24;background:rgba(251,191,36,.12)}.game-h .bo-r{color:#f87171;background:rgba(248,113,113,.12)}
.game-h .info{margin-left:auto;font-size:13.5px;color:var(--acc);font-weight:550}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.cards{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}}
.pc{background:var(--card);border-radius:var(--r);overflow:hidden;align-self:start}
.pc-h{display:flex;align-items:center;gap:12px;padding:16px 18px 10px}
.pc-h .nm b{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.pc-h .nm span{font-size:13px;color:var(--tx3)}
.rows{list-style:none}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 18px;border-top:1px solid var(--line2)}
.row:hover,.row:active{background:rgba(255,255,255,.025)}
.row .mk{flex:1;min-width:0}
.row .mk b{display:block;font-weight:650;font-size:15.5px}
.row .mk span{display:block;font-size:13px;color:var(--tx3);margin-top:1px}
.row .mk .tag{font-style:normal;margin-left:8px}
.empty{padding:40px 16px;text-align:center;color:var(--tx3)}

/* injuries */
.panel{background:var(--card);border-radius:var(--r);overflow:hidden}
.panel h3{font-size:13px;font-weight:650;padding:16px 18px 6px;color:var(--tx2);display:flex;gap:8px;align-items:center}
.panel h3 .tag{margin-left:0}
.ilist{list-style:none;padding:0 0 8px}
.ilist li{display:flex;align-items:center;gap:12px;padding:8px 18px}
.ilist .nm{flex:1;min-width:0;font-size:15px;font-weight:600}
.ilist .nm span{display:block;font-size:13px;color:var(--tx3);font-weight:400}
details.notes{border-top:1px solid var(--line2)}
details.notes summary{list-style:none;padding:14px 18px;font-size:14px;font-weight:550;color:var(--acc);cursor:pointer}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::after{content:" ›";display:inline-block;transition:transform .2s}
details.notes[open] summary::after{transform:rotate(90deg)}
details.notes p{padding:0 18px 14px;font-size:14px;color:var(--tx2);line-height:1.55}
.stamp{font-size:12.5px;color:var(--tx3);padding:12px 4px;line-height:1.6}

/* tabs (mobile) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(18,22,28,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line2);display:flex;padding:6px 8px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:550;color:var(--tx3)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--tx)}
nav.tabs .badge{font-size:10px;background:var(--bad);color:#fff;border-radius:99px;padding:0 5px;margin-left:3px}
@media (min-width:1024px){nav.tabs{display:none}}

/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:90vh;background:var(--bg2);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.sheet .x{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:20px;line-height:34px;z-index:1}
.sb{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 18px calc(24px + var(--safe-b))}
@media (min-width:1024px){
  .sheet{left:auto;top:0;bottom:0;width:480px;max-height:none;border-radius:0;transform:translateX(102%);box-shadow:-10px 0 40px rgba(0,0,0,.5)}
  .sheet .grab{display:none}
  .sb{padding:24px 24px 32px}
}
.sh-h{display:flex;gap:14px;align-items:center;padding-right:44px;margin-bottom:18px}
.sh-h b{display:block;font-size:20px;font-weight:750;letter-spacing:-.3px}
.sh-h span{font-size:13.5px;color:var(--tx3)}
.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:6px}
.big .l{font-size:26px;font-weight:800;letter-spacing:-.6px}
.big .muted{font-size:17px}
.pnote{font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 22px}
.st{background:var(--card);border-radius:var(--r2);padding:11px 12px}
.st small{display:block;font-size:12px;color:var(--tx3)}
.st b{display:block;font-size:20px;font-weight:750;margin-top:1px;letter-spacing:-.3px}
.st span{font-size:12px;color:var(--tx2)}
.blk{margin-bottom:24px}
.blk h4{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.blk h4 .dim{font-weight:500;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:5px;height:128px;position:relative;padding:18px 52px 0 0;border-bottom:1px solid var(--line)}
.bar{flex:1;position:relative;border-radius:5px 5px 0 0;min-height:3px}
.bar.h{background:rgba(52,211,153,.72)} .bar.mi{background:rgba(248,113,113,.68)}
.bar em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:600;color:var(--tx2)}
.thr{position:absolute;left:0;right:0;height:0;border-top:2px dashed #fff;pointer-events:none;z-index:2;filter:drop-shadow(0 0 2px rgba(0,0,0,.9))}
.thr span{position:absolute;right:0;top:-11px;background:#fff;color:#0d1015;font-size:11px;font-weight:800;line-height:1;padding:4px 6px;border-radius:6px;white-space:nowrap}
.xl{display:flex;gap:5px;margin-top:5px;padding-right:52px}
.xl span{flex:1;text-align:center;font-size:10px;color:var(--tx3);line-height:1.25;overflow:hidden}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;font-weight:500;color:var(--tx3);text-align:right;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line2)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td.v{font-weight:700}
.ok{color:var(--good)} .no{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;align-items:center;background:var(--card);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px}
.kv .k{color:var(--tx2)}
.kv .hd2{font-size:11.5px;color:var(--tx3);text-align:right}
.rk{font-size:12px;font-weight:650;padding:2px 7px;border-radius:6px;min-width:40px;text-align:center;display:inline-block}
.g{color:var(--good);background:var(--good-bg)} .m{color:var(--mid);background:var(--mid-bg)} .b{color:var(--bad);background:var(--bad-bg)}
.note{font-size:12.5px;color:var(--tx3);margin-top:8px;line-height:1.45}
.ww{background:var(--card);border-radius:var(--r2);padding:12px 14px;margin-bottom:8px;font-size:14px}
.ww .t1{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.ww .t1 b{font-weight:650}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.split2 div{background:var(--bg2);border-radius:10px;padding:8px 10px}
.split2 small{display:block;font-size:11.5px;color:var(--tx3)}
.mtg{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line2)}
.more-link{font-size:14px;font-weight:550;color:var(--acc);cursor:pointer;list-style:none}
.more-link::-webkit-details-marker{display:none}
@media (max-width:1023px){body[data-tab] .layout>section{display:none!important}
 body[data-tab="parlays"] #s-parlays,body[data-tab="props"] #s-props,body[data-tab="inj"] #s-inj,body[data-tab="ranks"] #s-ranks,body[data-tab="rec"] #s-rec,body[data-tab="live"] #s-live{display:block!important}}
@media (min-width:1024px){#s-props,#s-ranks{grid-column:1}#s-rec{grid-column:1 / -1}#s-live{grid-column:1 / -1}#s-inj{grid-column:2;grid-row:4 / span 2}}
html,body{overflow-x:hidden}
.srch{width:100%;font:inherit;font-size:15px;background:var(--card);color:var(--tx);border:0;border-radius:999px;padding:10px 16px;margin-bottom:10px;outline:none}
.srch:focus{box-shadow:0 0 0 2px var(--acc)}
.selects{flex-wrap:wrap}
.tgl{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--tx2);padding:4px 4px}
.tgl input{accent-color:var(--acc);width:16px;height:16px}
.row .add,.lad .add{flex:none;width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--tx2);font-size:18px;font-weight:600;line-height:32px;text-align:center}
.add.in{background:var(--acc);color:#0d1015}
.row{padding-right:12px}
.more{display:block;width:100%;padding:12px 18px;border-top:1px solid var(--line2);font-size:14px;font-weight:550;color:var(--acc);text-align:left}
.qb{color:var(--good);background:var(--good-bg)}
.stabs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;margin:0 0 16px;position:sticky;top:-12px;z-index:3}
.stabs button{flex:1;padding:8px 6px;border-radius:999px;font-size:14px;font-weight:600;color:var(--tx2)}
.stabs button.on{background:var(--tx);color:var(--bg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 8px;align-items:center}
.ctl .sel{flex:1 1 110px;max-width:none}
.sum{font-size:13.5px;color:var(--tx2);margin:6px 0 12px;line-height:1.5}.sum b{color:var(--tx)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.t.gl{font-size:13px;min-width:560px}table.t.gl td,table.t.gl th{padding:6px 5px}
table.t tr.gr td{color:var(--tx3)}
td.y{color:var(--good);font-weight:700}td.n{color:var(--bad);font-weight:700}
.lad h5{font-size:13.5px;font-weight:700;margin:16px 0 6px;color:var(--tx2)}
.lad table.t td{vertical-align:middle}
.rt td.me{color:var(--acc);font-weight:700}
.rt tr.tn td{background:rgba(124,156,255,.08)}
.slip{position:fixed;left:8px;right:8px;bottom:calc(72px + var(--safe-b));z-index:40;background:#1b2130;border:1px solid rgba(124,156,255,.35);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:560px;margin:0 auto}
.slip.on{display:block}
@media (min-width:1024px){.slip{bottom:16px;left:auto;right:24px;width:400px}}
.slip .sh{display:flex;align-items:center;gap:10px;padding:12px 14px;width:100%;text-align:left}
.slip .sh b{font-size:15px}.slip .sh .r{margin-left:auto;text-align:right;font-size:13px;color:var(--tx2)}.slip .sh .r b{color:var(--good);font-size:16px}
.slip ul{list-style:none;max-height:40vh;overflow:auto;border-top:1px solid var(--line2)}
.slip li{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.slip li span{flex:1;min-width:0}.slip li button{color:var(--bad);font-size:18px;width:28px}
.slip .ft{display:flex;gap:8px;padding:10px 14px}.slip .ft button{font-size:13.5px;color:var(--acc);font-weight:600}
.plbtn{font-size:13px;font-weight:600;color:var(--acc);padding:10px 20px 14px;display:block}
.ix{font-size:12.5px;color:var(--tx3);margin:6px 2px 0}
.itg{display:flex;align-items:center;gap:6px;margin:-4px 18px 8px auto;font-size:12px;font-weight:600;color:var(--acc);padding:3px 10px;border-radius:999px;background:var(--acc-bg)}
.itg .tag{margin-left:0;vertical-align:0}.itg.on{background:var(--card2)}
.rows li>.row{flex:1 1 0;min-width:0}
.tag.ln{background:rgba(255,255,255,.06)}
.ins{flex:1 1 100%;margin:0 12px 12px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);font-size:13.5px;color:var(--tx2)}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.igrid .st{background:var(--card);border-radius:10px;padding:7px 9px}.igrid small{display:block;font-size:11px;color:var(--tx3)}.igrid b{display:block;font-size:16px}.igrid span{font-size:11.5px;color:var(--tx3)}
.idl{display:grid;grid-template-columns:max-content 1fr;gap:5px 12px;margin:0 0 8px}.idl dt{color:var(--tx3);font-size:12.5px}.idl dd{margin:0;color:var(--tx)}

  h+='<div class="blk"><h4>Meetings</h4>'+teamH2H(g)+'</div>';
  var pl=Object.keys(PLAYERS).filter(function(n){return PLAYERS[n].game===g;});
  if(pl.length)h+='<div class="blk"><h4>Players</h4>'+pl.map(function(n){return '<button class="leg" data-pl="'+esc(n)+'" style="padding:8px 0">'+av(n,"sm")+'<span class="nm"><b>'+esc(n)+statusTag(n)+'</b><span>'+vsLine(n)+'</span></span></button>';}).join("")+'</div>';
  S.sh=null;openSheet(h);}
/* slip */
function renderSlip(){var el=document.getElementById("slip"),legs=S.slip.map(function(i){return PROPS[i];});
  el.classList.toggle("on",legs.length>0);if(!legs.length){el.innerHTML="";return;}
  var d=legs.reduce(function(s,p){return s*dec(p.odds);},1),am=toAm(d),known=legs.every(function(p){return has(p.hits)&&p.games;});
  var h='<button class="sh" id="slipT"><b>Bet slip · '+legs.length+' leg'+(legs.length>1?"s":"")+'</b><span class="r"><b class="num">'+fmtOdds(am)+'</b><br>$10 pays '+money(10*d)+(known?' · est. '+(estAll(legs)*100).toFixed(0)+'%':'')+'</span></button>';
  if(S.slipOpen){h+='<ul>'+legs.map(function(p){return '<li><span><b>'+esc(p.player)+'</b> '+esc(propLabel(p))+' <span class="dim">'+fmtOdds(p.odds)+'</span></span><button data-rm="'+p.i+'" aria-label="Remove">×</button></li>';}).join("")+'</ul><div class="ft"><button id="slipC">Clear slip</button><span class="dim" style="font-size:12px;margin-left:auto">Est. = product of (hits+1)/(games+2). Research only.</span></div>';}
  el.innerHTML=h;}
function toggleSlip(i){var j=S.slip.indexOf(i);if(j>-1)S.slip.splice(j,1);else{var p=PROPS[i];S.slip=S.slip.filter(function(x){return PROPS[x].player!==p.player;});S.slip.push(i);}renderSlip();refresh();}
function refresh(){renderProps();renderParlays();if(S.sh)renderSheet(true);}
/* events */
document.addEventListener("click",function(e){
  if(e.target.closest("[data-gorec]")){if(window.innerWidth<1024){document.querySelector('#tabs [data-t="rec"]').click();}else document.getElementById("s-rec").scrollIntoView({behavior:"smooth"});return;}
  var ti=e.target.closest("[data-ins]");if(ti){var k=+ti.dataset.ins;S.ins[k]=!S.ins[k];renderProps();return;}
  var td=e.target.closest("[data-dd]");if(td){var kd=td.dataset.dd;S.dd[kd]=!S.dd[kd];renderParlays();return;}
  var t=e.target.closest("[data-ins],[data-dd],[data-add],[data-rm],[data-load],[data-st],[data-p],[data-pl],[data-game],[data-g],[data-t],[data-rkt],#slipT,#slipC");if(!t)return;
  if(t.id==="slipT"){S.slipOpen=!S.slipOpen;renderSlip();return;}
  if(t.id==="slipC"){S.slip=[];renderSlip();refresh();return;}
  if(t.dataset.add!=null){toggleSlip(+t.dataset.add);return;}
  if(t.dataset.rm!=null){S.slip.splice(S.slip.indexOf(+t.dataset.rm),1);renderSlip();refresh();return;}
  if(t.dataset.load!=null){var pl=CFG.parlays[+t.dataset.load];S.slip=pl.legs.map(function(l){var p=byKey[l[0]+"|"+l[1]+"|"+l[2]];return p?p.i:null;}).filter(function(x){return x!=null;});S.slipOpen=true;renderSlip();refresh();return;}
  if(t.dataset.st){S.sh.t=t.dataset.st;renderSheet(true);return;}
  if(t.dataset.p!=null){var p=PROPS[+t.dataset.p];openPlayer(p.player,S.sh&&S.sh.n===p.player?S.sh.t:(inRange(p)?"ins":"gl"),p);return;}
  if(t.dataset.pl){openPlayer(t.dataset.pl,t.dataset.tab||"lad",null);return;}
  if(t.dataset.game){gameSheet(t.dataset.game);return;}
  if(t.dataset.g){S.game=t.dataset.g;renderProps();return;}
  if(t.dataset.rkt){S.rk.tm=t.dataset.rkt;renderRanks();return;}
  if(t.dataset.t){document.body.dataset.tab=t.dataset.t;document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b===t);});window.scrollTo(0,0);}
});
document.addEventListener("change",function(e){var t=e.target,d=t.dataset;
  if(t.id==="sort"){S.sort=t.value;renderProps();}else if(t.id==="mkt"){S.mk=t.value;renderProps();}else if(t.id==="view"){S.view=t.value;renderProps();}else if(t.id==="qual"){S.qual=t.checked;renderProps();}
  else if(d.rk){S.rk[d.rk]=t.value;renderRanks();}
  else if(d.gm){S.sh.m=t.value;S.sh.line=null;renderSheet(true);}else if(d.gl){S.sh.line=+t.value;renderSheet(true);}else if(d.gs){S.sh.gs=t.value;renderSheet(true);}else if(d.g24){S.sh.g24=t.checked;renderSheet(true);}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var pos=e.target.selectionStart;renderProps();var q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}});
ov.addEventListener("click",closeSheet);document.getElementById("x").addEventListener("click",closeSheet);
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet();});
(function(){var y0=null;sheet.addEventListener("touchstart",function(e){y0=sb.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});sheet.addEventListener("touchend",function(e){if(y0!==null&&e.changedTouches[0].clientY-y0>80)closeSheet();y0=null;},{passive:true});})();
renderParlays();renderLive();renderProps();renderInj();renderRanks();renderRec();renderSlip();
})();

</script>
</body>
</html>
